{% extends 'base.html' %}
{% block title %}Reset Password – {{ school_settings.name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h4 class="mb-1 fw-bold">Forgot your password?</h4>
          <p class="text-muted mb-4">Enter the email address linked to your account and we'll send you a reset link.</p>

          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </div>
          </form>

          <hr>
          <p class="text-center mb-0 small">
            Remembered it? <a href="{% url 'accounts:login' %}">Back to login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Password Reset – {{ school_settings.name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 text-center">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <div style="font-size:3rem;">✅</div>
          <h4 class="fw-bold mt-2">Password changed!</h4>
          <p class="text-muted">Your password has been reset successfully. You can now log in with your new password.</p>
          <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log In Now</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
